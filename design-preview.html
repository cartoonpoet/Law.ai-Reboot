function dday(n) {
  if (n === 0) return { t: "D-DAY", c: T.danger };
  if (n < 0) return { t: `D+${-n}`, c: T.faint };
  return { t: `D-${n}`, c: n <= 3 ? T.danger : n <= 7 ? T.warning : T.muted };
}

function useCountUp(target, base) {
  const [n, setN] = useState(base);
  useEffect(() => {
    let cur = base;
    const id = setInterval(() => {
      cur += Math.max(1, Math.ceil((target - cur) / 7));
      if (cur >= target) { cur = target; clearInterval(id); }
      setN(cur);
    }, 55);
    return () => clearInterval(id);
  }, []);
  return n;
}

function NavItem({ item, active, expanded, onClick, activeChild }) {
  const hasKids = !!item.children;
  const isActive = active && !hasKids;
  const parentActive = active && hasKids;
  const [hover, setHover] = useState(false);
  const bg = isActive ? T.primary : hover || parentActive ? "rgba(255,255,255,.07)" : "transparent";
  const color = isActive ? "#fff" : parentActive ? T.navyText : T.navyMuted;
  return (
    <div>
      <button onClick={onClick} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
        style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "8px 10px", border: "none", cursor: "pointer", borderRadius: 6, background: bg, color, fontFamily: "Pretendard", fontSize: 13, fontWeight: isActive ? 700 : 500, textAlign: "left", transition: "background .12s, color .12s" }}>
        <Icon name={item.icon} size="sm" style={{ width: 16, height: 16, flexShrink: 0, opacity: .85 }} />
        <span style={{ flex: 1 }}>{item.label}</span>
        {hasKids && <Icon name={expanded ? "chevronDown" : "chevronRight"} size="sm" style={{ width: 13, height: 13, opacity: .35 }} />}
      </button>
      {hasKids && expanded && (
        <div style={{ margin: "1px 0 4px", paddingLeft: 10 }}>
          {item.children.map(c => {
            const on = activeChild === c.id;
            return (
              <button key={c.id} onClick={() => onClick(c.id)}
                style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "6px 10px 6px 20px", border: "none", cursor: "pointer", borderRadius: 5, background: on ? `${T.primary}20` : "transparent", color: on ? "#7aaaf8" : T.navyMuted, fontFamily: "Pretendard", fontSize: 12.5, fontWeight: on ? 700 : 400, textAlign: "left" }}>
                <span style={{ width: 3, height: 3, borderRadius: 999, background: on ? "#7aaaf8" : T.navyFaint, flexShrink: 0 }} />
                {c.label}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Sidebar({ activeNav, activeChild, onNavigate }) {
  const [open, setOpen] = useState({ contract: true });
  return (
    <aside style={{ width: 232, flexShrink: 0, background: T.navy, borderRight: `1px solid ${T.navyLine}`, height: "100%", display: "flex", flexDirection: "column", position: "sticky", top: 0 }}>
      <div style={{ padding: "18px 16px 14px", borderBottom: `1px solid ${T.navyLine}`, display: "flex", alignItems: "center", gap: 9 }}>
        <div style={{ width: 26, height: 26, borderRadius: 6, background: T.primary, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 800, fontSize: 15 }}>L</div>
        <div style={{ fontSize: 16, fontWeight: 800, letterSpacing: "-0.02em", color: "#fff" }}>Law<span style={{ opacity: .45 }}>.ai</span></div>
      </div>
      <nav style={{ flex: 1, overflowY: "auto", padding: "8px 10px", display: "flex", flexDirection: "column", gap: 1 }}>
        {NAV.map(item => {
          const active = item.id === activeNav;
          return (
            <NavItem key={item.id} item={item} active={active} expanded={!!open[item.id]} activeChild={active ? activeChild : null}
              onClick={childId => {
                if (item.children) {
                  if (typeof childId === "string") onNavigate(item.id, childId);
                  else setOpen(o => ({ ...o, [item.id]: !o[item.id] }));
                } else onNavigate(item.id);
              }} />
          );
        })}
      </nav>
      {/* 유저 프로필 — 도움말 제거 */}
      <div style={{ padding: "12px 14px", borderTop: `1px solid ${T.navyLine}`, display: "flex", alignItems: "center", gap: 9 }}>
        <div style={{ width: 30, height: 30, borderRadius: 7, background: T.primary, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, flexShrink: 0 }}>손</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: T.navyText }}>{USER.name}</div>
          <div style={{ fontSize: 11, color: T.navyMuted, marginTop: 1 }}>{USER.team}</div>
        </div>
        <button style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}>
          <Icon name="logOut" size="sm" style={{ width: 15, height: 15, color: T.navyFaint }} />
        </button>
      </div>
    </aside>
  );
}

const toneMap = {
  danger:  { bar: T.danger,   text: T.danger,   bg: "#fdf0f0" },
  primary: { bar: T.primary,  text: T.primary,  bg: "#f0f3ff" },
  success: { bar: "#1f8a52",  text: "#1f8a52",  bg: "#f0faf5" },
  warning: { bar: T.warning,  text: T.warning,  bg: "#fdf6ec" },
  neutral: { bar: T.borderStrong, text: T.muted, bg: T.surfaceAlt },
};

function PipelineStrip() {
  const maxCount = Math.max(...FLOW_STAGES.map(s => s.count));
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: T.radius, boxShadow: T.shadowCard, overflow: "hidden" }}>
      <div style={{ padding: "11px 16px", borderBottom: `1px solid ${T.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
          <Icon name="fileText" size="sm" style={{ width: 14, height: 14, color: T.muted }} />
          <span style={{ fontSize: 13, fontWeight: 700, color: T.heading }}>계약 검토 파이프라인</span>
        </div>
        <span style={{ fontSize: 11.5, color: T.faint }}>오늘 09:42 기준 · 160건 진행 중</span>
      </div>
      <div style={{ display: "flex" }}>
        {FLOW_STAGES.map((stage, idx) => {
          const tone = toneMap[stage.tone || "neutral"];
          const barH = Math.max(3, Math.round((stage.count / maxCount) * 26));
          return (
            <Fragment key={stage.id}>
              <div style={{ flex: 1, padding: "13px 14px 12px", cursor: "pointer", background: stage.bottleneck ? tone.bg : "transparent", position: "relative" }}>
                {stage.bottleneck && (
                  <div style={{ position: "absolute", top: 7, right: 8, fontSize: 9.5, fontWeight: 700, color: tone.text, background: "#fff", border: `1px solid ${tone.bar}44`, padding: "1px 5px", borderRadius: 3 }}>병목</div>
                )}
                <div style={{ fontSize: 11, fontWeight: 600, color: T.faint, marginBottom: 8, whiteSpace: "nowrap" }}>{stage.label}</div>
                <div style={{ display: "flex", alignItems: "flex-end", height: 28, marginBottom: 7 }}>
                  <div style={{ width: "55%", height: barH, background: tone.bar, borderRadius: 3, opacity: stage.bottleneck ? .9 : .35 }} />
                </div>
                <div style={{ fontSize: 22, fontWeight: 800, color: stage.bottleneck ? tone.text : T.heading, letterSpacing: "-0.03em", fontVariantNumeric: "tabular-nums" }}>{stage.count}</div>
                <div style={{ fontSize: 11, color: T.faint, marginTop: 1 }}>건</div>
              </div>
              {idx < FLOW_STAGES.length - 1 && (
                <div style={{ display: "flex", alignItems: "center", flexShrink: 0 }}>
                  <Icon name="chevronRight" size="sm" style={{ width: 11, height: 11, color: T.borderStrong }} />
                </div>
              )}
            </Fragment>
          );
        })}
      </div>
    </div>
  );
}

        </div>
      </Panel>
    </div>
  );
}

function LifecycleRail({ steps }) {
  const last = steps.length - 1;
  return (
    <div style={{ display: "flex", alignItems: "flex-start", overflowX: "auto", padding: "4px 2px 2px" }}>
      {steps.map((s, i) => {
        const done = s.status === "completed", act = s.status === "active";
        const dotBg = done ? T.primary : "#fff";
        const dotBd = done || act ? T.primary : T.borderStrong;
        return (
          <div key={i} style={{ flex: 1, minWidth: 72, position: "relative", textAlign: "center", paddingTop: 3 }}>
            {i > 0 && <div style={{ position: "absolute", left: 0, right: "50%", top: 12, height: 2, background: done || act ? T.primary : T.border }} />}
            {i < last && <div style={{ position: "absolute", left: "50%", right: 0, top: 12, height: 2, background: done ? T.primary : T.border }} />}
            <div style={{ position: "relative", width: 22, height: 22, margin: "0 auto", borderRadius: 999, background: dotBg, border: `2px solid ${dotBd}`, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: act ? `0 0 0 4px ${T.primarySoft}` : "none" }}>
              {done && <Icon name="check" size="sm" style={{ width: 12, height: 12, color: "#fff" }} />}
              {act && <span style={{ width: 8, height: 8, borderRadius: 999, background: T.primary }} />}
            </div>
            <div style={{ marginTop: 8, fontSize: 11, fontWeight: act ? 700 : 500, color: act ? T.heading : done ? T.body : T.faint, whiteSpace: "nowrap" }}>{s.label}</div>
          </div>
        );
      })}
    </div>
  );
}

function Fact({ label, children }) {
  return (
    <div>
      <div style={{ fontSize: 11, color: T.faint, fontWeight: 600, marginBottom: 5 }}>{label}</div>
      <div style={{ fontSize: 13.5, color: T.heading, fontWeight: 600 }}>{children}</div>
    </div>
  );
}

const RISK_LEVEL = {
  high: { c: T.danger, bg: "#fbeaea", label: "고위험" },
  mid: { c: "#8a5a00", bg: "#f8ead0", label: "주의" },
  low: { c: T.muted, bg: "#eef0f4", label: "참고" },
};
function RiskCard({ r }) {
  const L = RISK_LEVEL[r.level];
  const [h, setH] = useState(false);
  return (
    <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ border: `1px solid ${T.border}`, borderLeft: `3px solid ${L.c}`, borderRadius: 7, padding: "12px 14px", background: h ? T.surfaceAlt : T.surface, transition: "background .1s" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
        <span style={{ fontSize: 10.5, fontWeight: 800, color: L.c, background: L.bg, padding: "1px 7px", borderRadius: 4 }}>{L.label}</span>
        <span style={{ fontSize: 13.5, fontWeight: 700, color: T.heading }}>{r.clause}</span>
      </div>
      <div style={{ fontSize: 12.5, color: T.body, lineHeight: 1.55, marginBottom: 7 }}>{r.finding}</div>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 6, padding: "7px 10px", background: T.primaryTint, borderRadius: 5 }}>
        <Icon name="autoAwesome" size="sm" style={{ width: 13, height: 13, color: T.primary, marginTop: 1, flexShrink: 0 }} />
        <span style={{ fontSize: 12, color: T.primaryDark, fontWeight: 600, lineHeight: 1.5 }}>{r.suggest}</span>
      </div>
    </div>
  );
}

function KVRow({ label, children, last }) {
  return (
    <div style={{ display: "flex", borderBottom: last ? "none" : `1px solid ${T.border}` }}>
      <div style={{ width: 130, flexShrink: 0, padding: "11px 14px", background: T.surfaceAlt, fontSize: 12.5, color: T.muted, fontWeight: 600 }}>{label}</div>
      <div style={{ flex: 1, padding: "11px 14px", fontSize: 13, color: T.heading }}>{children}</div>
    </div>
  );
}

        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 18, position: "sticky", top: 16 }}>
          <Card bordered header={<CardTitle icon="approvalCompleted">결재선</CardTitle>}>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {[{ n: "손준호", r: "기안 · 법무팀", c: "primary" }, { n: "이법무", r: "검토 · 법무팀장", c: "info" }, { n: "정상무", r: "승인 · 경영지원본부", c: "success" }].map((p, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ width: 16, fontSize: 11, fontWeight: 800, color: T.faint, textAlign: "center", flexShrink: 0 }}>{i + 1}</span>
                  <Avatar initials={p.n[0]} color={p.c} size="sm" />
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: T.heading }}>{p.n}</div>
                    <div style={{ fontSize: 11, color: T.faint }}>{p.r}</div>
                  </div>
                </div>
              ))}
            </div>
          </Card>

          <Card bordered header={<CardTitle icon="factCheck">작성 진행</CardTitle>}>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {checklist.map((it, i) => (
                <Checkbox key={i} size="small" label={it.label} checked={it.done} readOnly />
              ))}
            </div>
            <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${T.border}` }}>
              <div style={{ display: "grid" }}>
                <Button iconLeft={<Icon name="submit" size="sm" style={{ width: 14, height: 14 }} />} onClick={() => onOpen(DETAIL.id)}>{editMode ? "수정 완료" : "검토 요청 제출"}</Button>
              </div>
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

// 미구현 화면 플레이스홀더
function Placeholder({ title }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: 440, textAlign: "center", color: T.faint }}>
      <div style={{ width: 60, height: 60, borderRadius: 16, background: T.surface, border: `1px solid ${T.border}`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16 }}>
        <Icon name="layout" size="lg" style={{ width: 28, height: 28, color: T.borderStrong }} />
      </div>
      <h2 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: T.body }}>{title}</h2>
      <p style={{ margin: "8px 0 0", fontSize: 13.5, maxWidth: 360 }}>이 화면은 다음 단계에서 제작합니다.</p>
    </div>
  );
}

// ── 프리뷰 전환 바 (확정 시안 바로가기) ──────────────────────────
const PREVIEW_SCREENS = [
  { id: "login",      label: "로그인" },
  { id: "dashboard",  label: "대시보드" },
  { id: "c-list",     label: "계약 조회" },
  { id: "c-detail",   label: "계약 상세" },
  { id: "c-request",  label: "검토 요청" },
];

function PreviewBar({ current, onJump }) {
  return (
    <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 6, padding: "7px 10px", background: "rgba(20,26,43,.92)", backdropFilter: "blur(12px)", borderRadius: 12, border: "1px solid rgba(255,255,255,.1)", zIndex: 999, boxShadow: "0 8px 32px rgba(0,0,0,.3)" }}>
      <span style={{ fontSize: 11, fontWeight: 600, color: "rgba(255,255,255,.4)", alignSelf: "center", marginRight: 4, paddingRight: 8, borderRight: "1px solid rgba(255,255,255,.1)" }}>확정 시안</span>
      {PREVIEW_SCREENS.map(v => (
        <button key={v.id} onClick={() => onJump(v.id)}
          style={{ padding: "5px 12px", borderRadius: 7, border: v.id === current ? "none" : "1px solid rgba(255,255,255,.1)", background: v.id === current ? T.primary : "transparent", color: v.id === current ? "#fff" : "rgba(255,255,255,.55)", fontFamily: "Pretendard", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
          {v.label}
        </button>
      ))}
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(false);
  // nav: { id, child, contractId, edit }
  const [nav, setNav] = useState({ id: "home", child: null });

  const onNavigate = (id, child = null, opts = {}) => setNav({ id, child, ...opts });
  const onOpen = (contractId) => setNav({ id: "contract", child: "c-detail", contractId });

  // 프리뷰 바 바로가기
  const jump = (screen) => {
    if (screen === "login") { setAuthed(false); return; }
    setAuthed(true);
    if (screen === "dashboard") setNav({ id: "home", child: null });
    else if (screen === "c-list") setNav({ id: "contract", child: "c-list" });
    else if (screen === "c-detail") setNav({ id: "contract", child: "c-detail", contractId: DETAIL.id });
    else if (screen === "c-request") setNav({ id: "contract", child: "c-request" });
  };

  // 현재 프리뷰 바 하이라이트 계산
  const current = !authed ? "login"
    : nav.id === "home" ? "dashboard"
    : nav.child === "c-list" ? "c-list"
    : nav.child === "c-detail" ? "c-detail"
    : nav.child === "c-request" ? "c-request"
    : "dashboard";

  // 본문 라우팅
  let content;
  if (nav.id === "home") {
    content = <Dashboard onNavigate={onNavigate} onOpen={onOpen} />;
  } else if (nav.id === "contract") {
    if (nav.child === "c-list") content = <ContractList onOpen={onOpen} onNavigate={onNavigate} />;
    else if (nav.child === "c-detail") content = <ContractDetail onNavigate={onNavigate} />;
    else if (nav.child === "c-request") content = <ContractRequest onOpen={onOpen} onNavigate={onNavigate} editMode={nav.edit} />;
    else content = <Placeholder title="계약" />;
  } else {
    const label = (NAV.find(n => n.id === nav.id) || {}).label || "화면";
    content = <Placeholder title={label} />;
  }

  return (
    <div className={lightThemeClass} style={{ height: "100vh", display: "flex", flexDirection: "column" }}>
      {!authed ? (
        <LoginPage onLogin={() => { setAuthed(true); setNav({ id: "home", child: null }); }} />
      ) : (
        <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
          <Sidebar activeNav={nav.id} activeChild={nav.child} onNavigate={onNavigate} />
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            <TopBar />
            <main style={{ flex: 1, overflowY: "auto", padding: "22px 24px 80px" }}>
              {content}
            </main>
          </div>
        </div>
      )}
      <PreviewBar current={current} onJump={jump} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
// JSX 소스를 읽어 Babel로 변환 → blob URL로 import (importmap 호환)
(async function () {
  try {
    const src = document.getElementById("app-src").textContent;
    const out = Babel.transform(src, { presets: ["react"], filename: "app.jsx" }).code;
    const url = URL.createObjectURL(new Blob([out], { type: "text/javascript" }));
    await import(url);
  } catch (e) {
    console.error(e);
    document.getElementById("root").innerHTML =
      '<div class="_loading" style="color:#d23b3b"><b>로딩 오류</b><pre style="font-size:12px;white-space:pre-wrap;max-width:600px;margin-top:12px">' +
      (e && e.message ? e.message : String(e)) + "</pre></div>";
  }
})();
</script>
</body>
</html>
