<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --primary:#2151ec;--primaryDark:#1739a5;--primarySoft:#eaefff;--primaryTint:#2151ec0d;
    --success:#1f8a52;--danger:#d23b3b;--warning:#b8801a;--warningDark:#8a5a00;--info:#0e7c8c;
    --heading:#161a26;--body:#3d4658;--muted:#6b7488;--faint:#9aa1b2;
    --pageBg:#eef0f4;--surface:#fff;--surfaceAlt:#f4f5f8;--border:#e4e6ec;--borderStrong:#d3d7e0;
    --navy:#141a2b;--navyLine:#252f4a;--navyText:#c2cad8;--navyMuted:#7a849a;--navyFaint:#4a5570;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Pretendard,system-ui,-apple-system,sans-serif;background:#dfe3ea;color:var(--body);}
  .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .ic-fill{fill:currentColor;stroke:none;}

  .tabbar{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .tab{font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);background:var(--surfaceAlt);border:1px solid var(--border);border-radius:99px;padding:8px 16px;cursor:pointer;}
  .tab.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .hint{font-size:12px;color:var(--faint);align-self:center;margin-left:8px;}

  .stage{background:var(--pageBg);}
  .view{display:none;}.view.on{display:block;}
  .page{max-width:1120px;margin:0 auto;padding:24px 24px 70px;}
  .page.narrow{max-width:820px;}

  .eyebrow{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.07em;text-transform:uppercase;}
  h1.title{margin:7px 0 0;font-size:23px;font-weight:800;color:var(--heading);letter-spacing:-.025em;}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:9px 15px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-outline{background:#fff;color:var(--body);border-color:var(--borderStrong);}
  .btn-ghost{background:none;color:var(--muted);border:none;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:default;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);}
  .chead{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--heading);}
  .chead .ic{color:var(--muted);}
  .secnum{width:22px;height:22px;border-radius:6px;background:var(--primarySoft);color:var(--primary);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cbody{padding:18px 16px;}
  .stack{display:flex;flex-direction:column;gap:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .full{grid-column:1/-1;}
  .lbl{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--body);margin-bottom:8px;}
  .req::after{content:"•";color:var(--primary);font-size:15px;line-height:0;}
  .infoi{width:13px;height:13px;color:var(--faint);}

  .input{width:100%;font-family:inherit;font-size:13.5px;color:var(--heading);background:#fff;border:1px solid var(--borderStrong);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px;}
  .input .ph{color:var(--faint);}
  .input.ro{background:var(--surfaceAlt);color:var(--muted);}
  .input .ic{color:var(--faint);width:15px;height:15px;}
  .sel{justify-content:space-between;cursor:pointer;}
  .search{position:relative;}
  .search .input{padding-right:38px;}
  .search .si{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);}
  .search .input.val{color:var(--primary);font-weight:600;}

  .seg{display:inline-flex;background:var(--surfaceAlt);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;}
  .seg-btn{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 13px;border-radius:6px;cursor:pointer;border:none;background:none;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
  .seg-btn.on{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(16,24,40,.14);font-weight:700;}
  .seg-btn .ic{width:13px;height:13px;}

  .radio-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;height:42px;}
  .radio{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--heading);cursor:pointer;}
  .radio .rd{width:18px;height:18px;border-radius:99px;border:2px solid var(--borderStrong);position:relative;}
  .radio.on .rd{border-color:var(--primary);}
  .radio.on .rd::after{content:"";position:absolute;inset:3px;border-radius:99px;background:var(--primary);}

  .checks{display:flex;gap:18px;margin-top:9px;}
  .check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--body);cursor:pointer;}
  .check .ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--borderStrong);}

  .chips{display:flex;gap:8px;margin-top:9px;}
  .chip{font-size:12px;font-weight:600;color:var(--primary);border:1px solid #b9c9ff;background:#fff;border-radius:99px;padding:5px 13px;cursor:pointer;}

  .alert-info{display:flex;gap:9px;background:#e9f4f6;border:1px solid #cce4e8;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#0c5b67;line-height:1.55;}
  .alert-info .ic{color:var(--info);margin-top:1px;width:15px;height:15px;}
  .upload{border:1.5px dashed var(--borderStrong);border-radius:10px;background:var(--surfaceAlt);padding:18px;}
  .upbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--borderStrong);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--body);}
  .upsub{font-size:11.5px;color:var(--faint);margin-top:9px;}
  .filechip{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;margin-top:10px;}
  .filechip .ic{color:var(--primary);}

  .slider{position:relative;height:6px;border-radius:99px;background:var(--primarySoft);margin:20px 0 6px;}
  .slider > i{position:absolute;left:0;top:0;height:100%;width:50%;border-radius:99px;background:var(--primary);}
  .slider .knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:99px;background:#fff;border:2px solid var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .slider .val{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:var(--surfaceAlt);font-size:11.5px;font-weight:700;color:var(--heading);padding:1px 7px;border-radius:5px;}

  .editor{border:1px solid var(--borderStrong);border-radius:8px;overflow:hidden;}
  .etoolbar{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:7px 9px;background:var(--surfaceAlt);border-bottom:1px solid var(--border);color:var(--muted);}
  .eb{min-width:24px;height:24px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:12px;font-weight:700;}
  .esep{width:1px;height:15px;background:var(--borderStrong);margin:0 3px;}
  .earea{min-height:84px;background:#fff;}

  .appr{display:flex;align-items:center;gap:10px;}
  .appr .num{width:16px;font-size:11px;font-weight:800;color:var(--faint);text-align:center;flex-shrink:0;}
  .avatar{width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex-shrink:0;}
  .av-primary{background:var(--primary);}.av-info{background:var(--info);}.av-success{background:var(--success);}
  .appr .nm{font-size:13px;font-weight:700;color:var(--heading);}
  .appr .rl{font-size:11px;color:var(--faint);}
  .addrow{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--borderStrong);border-radius:8px;padding:9px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;}

  .risk{border:1px solid var(--border);border-radius:8px;padding:11px 13px;background:#fff;}
  .risk.high{border-left:3px solid var(--danger);}.risk.mid{border-left:3px solid var(--warningDark);}
  .rbadge{font-size:10px;font-weight:800;padding:1px 7px;border-radius:4px;}
  .rbadge.high{color:var(--danger);background:#fbeaea;}.rbadge.mid{color:var(--warningDark);background:#f8ead0;}
  .rclause{font-size:13px;font-weight:700;color:var(--heading);}
  .rfind{font-size:12px;color:var(--body);line-height:1.5;margin:6px 0 7px;}
  .rsuggest{display:flex;gap:6px;background:var(--primaryTint);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--primaryDark);font-weight:600;line-height:1.45;}
  .rsuggest .ic{color:var(--primary);width:13px;height:13px;margin-top:1px;}
  .muted-note{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--faint);margin-top:12px;line-height:1.5;}

  .progwrap{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:18px;position:sticky;top:62px;z-index:5;}
  .progbar{flex:1;height:7px;border-radius:99px;background:var(--surfaceAlt);overflow:hidden;}
  .progbar > i{display:block;height:100%;background:var(--primary);border-radius:99px;}
  .jumpnav{display:flex;gap:6px;flex-wrap:wrap;}
  .jump{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surfaceAlt);border-radius:99px;padding:4px 10px;cursor:pointer;}
  .jump.done{color:var(--success);}

  .kv{display:flex;border-bottom:1px solid var(--border);}
  .kv:last-child{border-bottom:none;}
  .kv .k{width:92px;flex-shrink:0;padding:9px 13px;background:var(--surfaceAlt);font-size:12px;color:var(--muted);font-weight:600;}
  .kv .v{flex:1;padding:9px 13px;font-size:12.5px;color:var(--heading);font-weight:600;}

  /* 작성 현황 패널 */
  .prgtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .prgnum{font-size:26px;font-weight:800;color:var(--primary);letter-spacing:-.02em;line-height:1;}
  .prgnum small{font-size:13px;color:var(--faint);font-weight:700;}
  .prgreq{font-size:11.5px;font-weight:700;color:var(--muted);}
  .prg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .prg:last-child{border-bottom:none;}
  .prg .st{width:20px;height:20px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .st.done{background:var(--success);color:#fff;}
  .st.part{background:#fff;border:2px solid var(--warning);}
  .st.part i{width:7px;height:7px;border-radius:99px;background:var(--warning);}
  .st.empty{background:#fff;border:2px solid var(--borderStrong);}
  .prg .pl{flex:1;font-size:12.5px;font-weight:700;color:var(--heading);}
  .prg.empty .pl{color:var(--muted);font-weight:600;}
  .pc{font-size:11px;font-weight:700;}
  .pc.done{color:var(--success);}.pc.part{color:var(--warningDark);}.pc.empty{color:var(--faint);}
  /* dark variant */
  .dpanel .prgnum{color:#7e9bff;}.dpanel .prgreq{color:var(--navyText);}
  .dpanel .prg{border-bottom-color:var(--navyLine);}
  .dpanel .prg .pl{color:#eef1f8;}.dpanel .prg.empty .pl{color:var(--navyMuted);}
  .dpanel .st.empty{background:transparent;border-color:var(--navyFaint);}
  .dpanel .progbar{background:#1c2438;}

  .dpanel{background:var(--navy);border:1px solid var(--navyLine);border-radius:10px;overflow:hidden;}
  .dph{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--navyLine);font-size:12.5px;font-weight:700;color:#fff;}
  .dph .ic{color:#7e9bff;}
  .dpb{padding:14px 15px;}
  .drisk{background:#1c2438;border:1px solid var(--navyLine);border-radius:8px;padding:10px 11px;}
  .drisk .rclause{color:#eef1f8;font-size:12.5px;}.drisk .rfind{color:var(--navyText);font-size:11.5px;margin:5px 0 0;}
  .dkv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--navyLine);}
  .dkv:last-child{border-bottom:none;}
  .dkv .k{color:var(--navyMuted);}.dkv .v{color:#fff;font-weight:600;text-align:right;}
  .dpanel .appr .nm{color:#fff;}.dpanel .appr .rl{color:var(--navyMuted);}.dpanel .appr .num{color:var(--navyFaint);}
  .scanline{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#7e9bff;font-weight:600;margin-bottom:10px;}

  .layout{display:grid;gap:18px;align-items:start;}
  .layout.rail{grid-template-columns:1fr 340px;}
  .sticky{position:sticky;top:78px;}
  #view-b .incard-ai{display:none;}

  .stepper{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:22px;overflow-x:auto;position:sticky;top:62px;z-index:5;}
  .step{display:flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap;}
  .step .dot{width:28px;height:28px;border-radius:99px;border:2px solid var(--borderStrong);color:var(--faint);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;}
  .step.on .dot{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primarySoft);}
  .step.done .dot{border-color:var(--primary);background:var(--primary);color:#fff;}
  .step .stp{font-size:9.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;}
  .step .nm{font-size:13px;font-weight:700;color:var(--heading);}
  .step.off .nm{color:var(--faint);}
  .connector{flex:1;min-width:18px;height:2px;background:var(--border);margin:0 12px;}
  .connector.done{background:var(--primary);}
  .wpanel{display:none;}.wpanel.on{display:block;}
  .wfoot{display:flex;justify-content:space-between;margin-top:18px;}
</style>
</head>
<body>

<div class="tabbar">
  <button class="tab on" data-v="a" onclick="setView('a')">A · 단계형 위저드</button>
  <button class="tab" data-v="b" onclick="setView('b')">B · AI 우선 (스마트 사이드)</button>
  <button class="tab" data-v="c" onclick="setView('c')">C · 구조 유지 · 시각 폴리시</button>
  <span class="hint">라이브 폼 전체 필드 반영 · 5개 그룹 · 모두 @lawkit/ui로 조립 가능</span>
</div>

<div class="stage">
  <div class="view on" id="view-a"></div>
  <div class="view" id="view-b"></div>
  <div class="view" id="view-c"></div>
</div>

<!-- ===================== FIELD GROUP TEMPLATES ===================== -->

      <div><span class="lbl">보안여부 <svg class="ic infoi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>

      <div class="full"><span class="lbl req">계약 분류</span><div class="grid3">

        <div class="input sel"><span class="ph">계약 대분류</span><svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
        <div class="input sel"><span class="ph">계약 중분류</span><svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div></div></div>
      <div class="full"><span class="lbl">계약 기간</span><div class="input" style="max-width:360px"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="ph">YYYY-MM-DD ~ YYYY-MM-DD</span></div>
        <div class="checks"><span class="check"><span class="ck"></span>직접 입력</span><span class="check"><span class="ck"></span>계약 종료일 없음</span></div></div>
      <div class="full"><span class="lbl req">상대 계약자 정보</span><div style="display:flex;gap:10px"><div class="search" style="flex:1;max-width:420px"><div class="input"><span class="ph">회사명</span></div><svg class="ic si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></div><button class="btn btn-outline btn-sm">+ 신규 추가</button></div></div>
    </div></div>
  </div>
</template>

<template id="tpl-docs">
  <div class="card">
    <div class="chead"><span class="secnum">2</span>계약서 · 첨부</div>
    <div class="cbody"><div class="stack">
      <div class="alert-info"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>검토 정확도를 위해 편집 가능한 워드(.docx) 파일 첨부를 권장합니다. 첨부 즉시 AI가 주요 리스크 조항을 사전 점검합니다.</div>
      <div><span class="lbl req">계약서</span>
        <div class="upload"><button class="upbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>첨부파일</button><div class="upsub">파일을 여기에 드래그하거나 버튼을 클릭해 선택하세요. · 가능한 워드(.docx) 권장</div>
          <div class="filechip"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><div style="flex:1"><div style="font-size:12.5px;font-weight:600;color:var(--heading)">SW공급계약서_v2.docx</div><div style="font-size:11px;color:var(--faint)">DOCX · 1.2MB</div></div><svg class="ic" viewBox="0 0 24 24" style="color:var(--faint)"><path d="M18 6L6 18M6 6l12 12"/></svg></div>

      lbl.innerHTML=d.dataset.ed+' <svg class="ic infoi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
      d.appendChild(lbl);d.appendChild(clone('tpl-editor'));
    });

  function group(id){var f=clone(id);hydrateEditors(f);return f;}

  function buildHead(buttons){

    return h;
  }
  var BTNS_FULL='<button class="btn btn-ghost">목록</button><button class="btn btn-outline">임시저장</button><button class="btn btn-primary"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>검토요청 등록</button>';

  /* ---------- VIEW C : polish (full flat, sectioned) ---------- */
  (function(){
    var v=document.getElementById('view-c');var p=document.createElement('div');p.className='page';
    p.appendChild(buildHead(BTNS_FULL));
    var lay=document.createElement('div');lay.className='layout rail';
    var col=document.createElement('div');col.className='stack';
    ['tpl-overview','tpl-docs','tpl-people','tpl-terms','tpl-content'].forEach(function(g){col.appendChild(group(g));});
    var rail=document.createElement('div');rail.className='sticky stack';rail.style.gap='16px';
    rail.appendChild(clone('tpl-progress'));rail.appendChild(clone('tpl-summary'));rail.appendChild(clone('tpl-approval'));
    lay.appendChild(col);lay.appendChild(rail);p.appendChild(lay);v.appendChild(p);
  })();

  /* ---------- VIEW B : AI-forward (left form + dark rail) ---------- */

    var v=document.getElementById('view-b');var p=document.createElement('div');p.className='page';
    p.appendChild(buildHead(BTNS_FULL));
    var lay=document.createElement('div');lay.className='layout rail';
    var col=document.createElement('div');col.className='stack';
    ['tpl-overview','tpl-docs','tpl-people','tpl-terms','tpl-content'].forEach(function(g){col.appendChild(group(g));});
    var rail=document.createElement('div');rail.className='sticky stack';rail.style.gap='14px';
    rail.innerHTML=
      '<div class="dpanel"><div class="dph"><svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>작성 현황</div><div class="dpb">'+

      '<div class="prg"><span class="st done"><svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M20 6L9 17l-5-5"/></svg></span><span class="pl">1 · 계약 개요</span><span class="pc done">5/5</span></div>'+
      '<div class="prg"><span class="st done"><svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M20 6L9 17l-5-5"/></svg></span><span class="pl">2 · 계약서 · 첨부</span><span class="pc done">1/1</span></div>'+
      '<div class="prg empty"><span class="st empty"></span><span class="pl">3 · 관계자 · 참조</span><span class="pc empty">선택</span></div>'+
      '<div class="prg"><span class="st part"><i></i></span><span class="pl">4 · 상세 조건</span><span class="pc part">0/1 남음</span></div>'+

    var st=document.createElement('div');st.className='stepper';var sh='';
    STEPS.forEach(function(s,i){
      sh+='<div class="step '+(i===0?'on':'off')+'" id="st'+i+'" onclick="setStep('+i+')"><div class="dot">'+(i+1)+'</div><div><div class="stp">STEP '+(i+1)+'</div><div class="nm">'+s.nm+'</div></div></div>';
      if(i<STEPS.length-1) sh+='<div class="connector" id="cn'+i+'"></div>';
    });
    st.innerHTML=sh;p.appendChild(st);
    STEPS.forEach(function(s,i){
      var wp=document.createElement('div');wp.className='wpanel'+(i===0?' on':'');wp.id='wp'+i;
      var stk=document.createElement('div');stk.className='stack';
      s.groups.forEach(function(g){stk.appendChild(group(g));});
      if(i===STEPS.length-1){stk.appendChild(clone('tpl-summary'));stk.appendChild(clone('tpl-approval'));}
      wp.appendChild(stk);
      var foot=document.createElement('div');foot.className='wfoot';
      foot.innerHTML=(i===0?'<button class="btn btn-ghost" disabled>이전</button>':'<button class="btn btn-outline" onclick="setStep('+(i-1)+')">← 이전</button>')+
        (i===STEPS.length-1?'<button class="btn btn-primary"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>검토요청 등록</button>':'<button class="btn btn-primary" onclick="setStep('+(i+1)+')">다음 →</button>');
      wp.appendChild(foot);p.appendChild(wp);
    });
    v.appendChild(p);
  })();

  function setView(x){
    document.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on',el.id==='view-'+x);});
    document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('on',el.dataset.v===x);});
    window.scrollTo(0,0);
  }
  function setStep(n){
    STEPS.forEach(function(s,i){
      document.getElementById('wp'+i).classList.toggle('on',i===n);
      var stp=document.getElementById('st'+i);stp.classList.remove('on','done','off');
      stp.classList.add(i===n?'on':(i<n?'done':'off'));
      if(i<STEPS.length-1)document.getElementById('cn'+i).classList.toggle('done',n>i);
    });
    window.scrollTo(0,0);
  }
</script>
</body>
</html>
