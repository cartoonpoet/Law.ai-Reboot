<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --primary:#2151ec;--primaryDark:#1739a5;--primarySoft:#eaefff;--primaryTint:#2151ec0d;
    --success:#1f8a52;--danger:#d23b3b;--warning:#b8801a;--warningDark:#8a5a00;--info:#0e7c8c;
    --heading:#161a26;--body:#3d4658;--muted:#6b7488;--faint:#9aa1b2;
    --pageBg:#eef0f4;--surface:#fff;--surfaceAlt:#f4f5f8;--border:#e4e6ec;--borderStrong:#d3d7e0;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Pretendard,system-ui,-apple-system,sans-serif;background:var(--pageBg);color:var(--body);}
  .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .ic-fill{fill:currentColor;stroke:none;}

  .page{max-width:1120px;margin:0 auto;padding:24px 24px 70px;}

  .eyebrow{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.07em;text-transform:uppercase;}
  h1.title{margin:7px 0 0;font-size:23px;font-weight:800;color:var(--heading);letter-spacing:-.025em;}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:9px 15px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-outline{background:#fff;color:var(--body);border-color:var(--borderStrong);}
  .btn-ghost{background:none;color:var(--muted);border:none;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:default;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);}
  .chead{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--heading);}
  .chead .ic{color:var(--muted);}
  .secnum{width:22px;height:22px;border-radius:6px;background:var(--primarySoft);color:var(--primary);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cbody{padding:18px 16px;}
  .stack{display:flex;flex-direction:column;gap:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .full{grid-column:1/-1;}
  .lbl{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--body);margin-bottom:8px;}
  .req::after{content:"•";color:var(--primary);font-size:15px;line-height:0;}
  .infoi{width:13px;height:13px;color:var(--faint);}

  .input{width:100%;font-family:inherit;font-size:13.5px;color:var(--heading);background:#fff;border:1px solid var(--borderStrong);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px;}
  .input .ph{color:var(--faint);}
  .input.ro{background:var(--surfaceAlt);color:var(--muted);}
  .input .ic{color:var(--faint);width:15px;height:15px;}
  .sel{justify-content:space-between;cursor:pointer;}
  .search{position:relative;}
  .search .input{padding-right:38px;}
  .search .si{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);}
  .search .input.val{color:var(--primary);font-weight:600;}

  /* lawkit ButtonGroup variant="outline" — 이어붙은 아웃라인 버튼 */
  .seg{display:inline-flex;}
  .seg-btn{font-family:inherit;font-size:14px;font-weight:500;color:var(--primary);height:38px;padding:0 12px;cursor:pointer;background:transparent;border:1px solid var(--primary);border-radius:0;margin-left:-1px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;line-height:1;transition:background-color .15s ease,color .15s ease;}
  .seg-btn:first-child{margin-left:0;border-top-left-radius:4px;border-bottom-left-radius:4px;}
  .seg-btn:last-child{border-top-right-radius:4px;border-bottom-right-radius:4px;}
  .seg-btn.on{background:#2151ec1f;color:var(--primary);font-weight:500;}
  .seg-btn .ic{width:14px;height:14px;}

  /* lawkit Radio variant="basic" — 미선택 회색 테두리, 선택 시 primary 단색 채움 */
  .radio-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;height:42px;}
  .radio{display:flex;align-items:center;gap:8px;font-size:14px;line-height:18px;color:var(--heading);cursor:pointer;}
  .radio .rd{width:14px;height:14px;border-radius:50%;border:1.5px solid #9ea7b8;background:#fff;box-sizing:border-box;transition:background-color .15s ease,border-color .15s ease;}
  .radio.on .rd{border:none;background:var(--primary);}

  /* lawkit Checkbox */
  .checks{display:flex;gap:18px;margin-top:9px;}
  .check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--body);cursor:pointer;}
  .check .ck{width:16px;height:16px;border-radius:3px;border:1.5px solid #cfd5e1;background:#fff;box-sizing:border-box;}

  .chips{display:flex;gap:8px;margin-top:9px;}
  .chip{font-size:12px;font-weight:600;color:var(--primary);border:1px solid #b9c9ff;background:#fff;border-radius:99px;padding:5px 13px;cursor:pointer;}

  .alert-info{display:flex;gap:9px;background:#e9f4f6;border:1px solid #cce4e8;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#0c5b67;line-height:1.55;}
  .alert-info .ic{color:var(--info);margin-top:1px;width:15px;height:15px;}
  .upload{border:1.5px dashed var(--borderStrong);border-radius:10px;background:var(--surfaceAlt);padding:18px;}
  .upbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--borderStrong);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--body);}
  .upsub{font-size:11.5px;color:var(--faint);margin-top:9px;}
  .filechip{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;margin-top:10px;}
  .filechip .ic{color:var(--primary);}

  .slider{position:relative;height:6px;border-radius:99px;background:var(--primarySoft);margin:20px 0 6px;}
  .slider > i{position:absolute;left:0;top:0;height:100%;width:50%;border-radius:99px;background:var(--primary);}
  .slider .knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:99px;background:#fff;border:2px solid var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .slider .val{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:var(--surfaceAlt);font-size:11.5px;font-weight:700;color:var(--heading);padding:1px 7px;border-radius:5px;}

  .editor{border:1px solid var(--borderStrong);border-radius:8px;overflow:hidden;}
  .etoolbar{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:7px 9px;background:var(--surfaceAlt);border-bottom:1px solid var(--border);color:var(--muted);}
  .eb{min-width:24px;height:24px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:12px;font-weight:700;}
  .esep{width:1px;height:15px;background:var(--borderStrong);margin:0 3px;}
  .earea{min-height:84px;background:#fff;}

  .appr{display:flex;align-items:center;gap:10px;}
  .appr .num{width:16px;font-size:11px;font-weight:800;color:var(--faint);text-align:center;flex-shrink:0;}
  .avatar{width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex-shrink:0;}
  .av-primary{background:var(--primary);}.av-info{background:var(--info);}.av-success{background:var(--success);}
  .appr .nm{font-size:13px;font-weight:700;color:var(--heading);}
  .appr .rl{font-size:11px;color:var(--faint);}
  .addrow{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--borderStrong);border-radius:8px;padding:9px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;}

  /* AI 사전 점검 (라이트) */
  .ai-head{background:var(--primaryTint);border-bottom-color:#cdd9ff;color:var(--primaryDark);font-size:13px;}
  .ai-head .ic{color:var(--primary);}
  .scanline{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--primary);font-weight:600;margin-bottom:11px;}
  .scanline .ic{color:var(--primary);width:13px;height:13px;}
  .risk{border:1px solid var(--border);border-radius:8px;padding:11px 12px;background:#fff;}
  .risk.high{border-left:3px solid var(--danger);}.risk.mid{border-left:3px solid var(--warningDark);}
  .rtop{display:flex;align-items:center;gap:8px;}
  .rbadge{font-size:10px;font-weight:800;padding:1px 7px;border-radius:4px;}
  .rbadge.high{color:var(--danger);background:#fbeaea;}.rbadge.mid{color:var(--warningDark);background:#f8ead0;}
  .rclause{font-size:12.5px;font-weight:700;color:var(--heading);}
  .rfind{font-size:11.5px;color:var(--body);line-height:1.5;margin:6px 0 0;}
  .muted-note{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--faint);margin-top:12px;line-height:1.5;}
  .muted-note .ic{width:13px;height:13px;}

  .kv{display:flex;border-bottom:1px solid var(--border);}
  .kv:last-child{border-bottom:none;}
  .kv .k{width:92px;flex-shrink:0;padding:9px 13px;background:var(--surfaceAlt);font-size:12px;color:var(--muted);font-weight:600;}
  .kv .v{flex:1;padding:9px 13px;font-size:12.5px;color:var(--heading);font-weight:600;}

  /* 작성 현황 패널 */
  .prgtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .prgnum{font-size:26px;font-weight:800;color:var(--primary);letter-spacing:-.02em;line-height:1;}
  .prgnum small{font-size:13px;color:var(--faint);font-weight:700;}
  .prgreq{font-size:11.5px;font-weight:700;color:var(--muted);}
  .progbar{height:7px;border-radius:99px;background:var(--surfaceAlt);overflow:hidden;}
  .progbar > i{display:block;height:100%;background:var(--primary);border-radius:99px;}
  .prg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .prg:last-child{border-bottom:none;}
  .prg .st{width:20px;height:20px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .st.done{background:var(--success);color:#fff;}
  .st.part{background:#fff;border:2px solid var(--warning);}
  .st.part i{width:7px;height:7px;border-radius:99px;background:var(--warning);}
  .st.empty{background:#fff;border:2px solid var(--borderStrong);}
  .prg .pl{flex:1;font-size:12.5px;font-weight:700;color:var(--heading);}
  .prg.empty .pl{color:var(--muted);font-weight:600;}
  .pc{font-size:11px;font-weight:700;}
  .pc.done{color:var(--success);}.pc.part{color:var(--warningDark);}.pc.empty{color:var(--faint);}

  .layout{display:grid;gap:18px;align-items:start;grid-template-columns:1fr 340px;}
  .sticky{position:sticky;top:24px;}
  @media(max-width:980px){.layout{grid-template-columns:1fr;}.sticky{position:static;}}

  /* 상대 계약자 AutoComplete (다중) + 검색 드롭다운 */
  .ac-pop{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:#fff;border:1px solid var(--borderStrong);border-radius:10px;box-shadow:0 10px 30px rgba(16,24,40,.14);overflow:hidden;}
  .ac-head{padding:8px 12px;font-size:11px;font-weight:700;color:var(--faint);background:var(--surfaceAlt);border-bottom:1px solid var(--border);}
  .ac-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);}
  .ac-opt:hover{background:var(--surfaceAlt);}
  .ac-opt.on{background:var(--primaryTint);}
  .ac-ic{width:32px;height:32px;border-radius:8px;background:var(--primarySoft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ac-ic.ind{background:#e9f4f6;color:var(--info);}
  .ac-main{flex:1;min-width:0;}
  .ac-name{font-size:13px;font-weight:700;color:var(--heading);display:flex;align-items:center;gap:6px;}
  .ac-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.55;}
  .ac-sub b{color:var(--body);font-weight:600;}
  .ac-check{margin-left:auto;width:18px;height:18px;color:var(--primary);flex-shrink:0;}
  .ac-new{display:flex;align-items:center;gap:7px;padding:11px 12px;font-size:12.5px;font-weight:700;color:var(--primary);cursor:pointer;}
  .ac-new:hover{background:var(--surfaceAlt);}
  .ttag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;line-height:1.5;}
  .ttag.co{color:var(--primary);background:var(--primarySoft);}
  .ttag.ind{color:var(--info);background:#e9f4f6;}
  .ttag.tmp{color:var(--warningDark);background:#f8ead0;}

  /* AutoComplete multiple 네이티브 badge (선택된 상대방) */
  .ac-badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
  .ac-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--primary);background:var(--primarySoft);border-radius:6px;padding:5px 10px;}
  .ac-badge .x{width:13px;height:13px;cursor:pointer;opacity:.75;}

  /* 신규 회사 추가 모달 */
  .modal-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:flex-start;justify-content:center;padding:56px 16px;z-index:50;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:540px;box-shadow:0 20px 60px rgba(16,24,40,.3);overflow:hidden;}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
  .mtitle{font-size:15px;font-weight:800;color:var(--heading);}
  .mclose{width:18px;height:18px;color:var(--muted);cursor:pointer;}
  .mbody{padding:18px;max-height:64vh;overflow:auto;}
  .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);background:var(--surfaceAlt);}
  .fld{margin-bottom:15px;}
  .fld:last-child{margin-bottom:0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .inline{display:flex;gap:8px;align-items:stretch;}
  .inline .input{flex:1;}
  .hint{font-size:11px;color:var(--faint);margin-top:6px;display:flex;align-items:flex-start;gap:5px;line-height:1.5;}
  .hint .ic{width:12px;height:12px;margin-top:1px;}
</style>
</head>
<body>

<div class="page">
  <div class="phead">
    <div><div class="eyebrow">계약</div><h1 class="title">계약서 검토 요청</h1></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost">목록</button>
      <button class="btn btn-outline">임시저장</button>
      <button class="btn btn-primary"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>검토요청 등록</button>
    </div>
  </div>

  <div class="layout">
    <div class="stack" id="form-col"></div>
    <div class="sticky stack" id="rail" style="gap:16px"></div>
  </div>
</div>

<!-- ===================== 신규 회사 추가 모달 ===================== -->
<div class="modal-backdrop" id="newco">
  <div class="modal">
    <div class="mhead">
      <span class="mtitle">상대 계약자 신규 등록</span>
      <svg class="ic mclose" id="newco-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
    <div class="mbody">
      <div class="fld"><span class="lbl">구분</span><div class="radio-row" style="height:auto"><span class="radio on"><span class="rd"></span>회사(법인)</span><span class="radio"><span class="rd"></span>개인(개인사업자)</span></div></div>
      <div class="fld"><span class="lbl req">회사명 / 상호</span><div class="input"><span class="ph">예) 삼성전자(주)</span></div></div>
      <div class="fld"><span class="lbl req">사업자등록번호</span>
        <div class="inline"><div class="input"><span class="ph">000-00-00000</span></div><button class="btn btn-outline btn-sm">중복확인</button></div>
        <div class="hint"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>미부여 상태면 비워두세요. 등록 시 임시번호가 자동 생성됩니다.</div>
      </div>
      <div class="fld row2">
        <div><span class="lbl">대표자명</span><div class="input"><span class="ph">대표자 이름</span></div></div>
        <div><span class="lbl">대표 전화</span><div class="input"><span class="ph">02-0000-0000</span></div></div>
      </div>
      <div class="fld"><span class="lbl">주소</span>
        <div class="inline"><div class="input"><span class="ph">도로명 주소를 검색하세요</span></div><button class="btn btn-outline btn-sm">주소검색</button></div>
        <div class="input" style="margin-top:8px"><span class="ph">상세주소 (동·호수 등)</span></div>
      </div>
      <div class="fld row2">
        <div><span class="lbl">담당자명</span><div class="input"><span class="ph">담당자 이름</span></div></div>
        <div><span class="lbl">담당자 연락처</span><div class="input"><span class="ph">010-0000-0000</span></div></div>
      </div>
      <div class="fld"><span class="lbl">담당자 이메일</span><div class="input"><span class="ph">name@company.com</span></div></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-outline" id="newco-cancel">취소</button>
      <button class="btn btn-primary">등록하고 선택</button>
    </div>
  </div>
</div>

<!-- ===================== FIELD GROUP TEMPLATES ===================== -->

<template id="tpl-overview">
  <div class="card">
    <div class="chead"><span class="secnum">1</span>계약 개요</div>
    <div class="cbody"><div class="grid2">
      <div><span class="lbl req">계약 단계</span><div class="radio-row"><span class="radio on"><span class="rd"></span>신규계약</span><span class="radio"><span class="rd"></span>변경·해지</span></div></div>
      <div><span class="lbl">보안여부 <svg class="ic infoi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
        <div class="seg"><button class="seg-btn"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>극비</button><button class="seg-btn on"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/></svg>보안</button><button class="seg-btn">일반</button></div></div>
      <div class="full"><span class="lbl req">계약명 <svg class="ic infoi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span><div class="input"><span class="ph">계약명을 입력하세요</span></div></div>
      <div><span class="lbl req">검토 요청자 <svg class="ic infoi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span><div class="search"><div class="input val">손준호 (팀(개발) | jhson1)</div><svg class="ic si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></div></div>
      <div><span class="lbl req">계약서 유형</span><div class="radio-row"><span class="radio on"><span class="rd"></span>일반 검토요청</span><span class="radio"><span class="rd"></span>표준계약서 계약체결</span></div></div>

<script>
  function clone(id){return document.getElementById(id).content.cloneNode(true);}
  function hydrateEditors(root){
    root.querySelectorAll('[data-ed]').forEach(function(d){
      var lbl=document.createElement('span');lbl.className='lbl'+(d.dataset.req?' req':'');
      lbl.innerHTML=d.dataset.ed+' <svg class="ic infoi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
      d.appendChild(lbl);d.appendChild(clone('tpl-editor'));
    });
  }
  function group(id){var f=clone(id);hydrateEditors(f);return f;}

  var col=document.getElementById('form-col');
  ['tpl-overview','tpl-docs','tpl-people','tpl-terms','tpl-content'].forEach(function(g){col.appendChild(group(g));});

  var rail=document.getElementById('rail');
  ['tpl-progress','tpl-ai','tpl-approval'].forEach(function(g){rail.appendChild(clone(g));});

  /* 상대 계약자: 검색 드롭다운 토글 + 신규 등록 모달 */
  (function(){
    var input=document.getElementById('cpt-input');
    var pop=document.getElementById('cpt-pop');
    var modal=document.getElementById('newco');
    function openModal(){modal.style.display='flex';}
    function closeModal(){modal.style.display='none';}
    if(input&&pop){
      input.addEventListener('click',function(e){e.stopPropagation();pop.style.display=(pop.style.display==='block'?'none':'block');});
      pop.querySelectorAll('.ac-opt').forEach(function(o){o.addEventListener('click',function(){pop.style.display='none';});});
      document.addEventListener('click',function(e){if(!pop.contains(e.target)&&e.target!==input)pop.style.display='none';});
    }
    var popNew=document.getElementById('cpt-pop-new');
    if(popNew)popNew.addEventListener('click',function(){if(pop)pop.style.display='none';openModal();});
    var newBtn=document.getElementById('cpt-new');
    if(newBtn)newBtn.addEventListener('click',openModal);
    ['newco-close','newco-cancel'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('click',closeModal);});
    if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
  })();
</script>
</body>
</html>
