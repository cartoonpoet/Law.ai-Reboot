# lawai-reboot.kro.kr — 정적 프론트 서빙 + /api 게이트웨이 프록시 + TLS
server {
    listen 80;
    listen [::]:80;
    server_name lawai-reboot.kro.kr;

    # Let's Encrypt 갱신용 챌린지
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외는 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lawai-reboot.kro.kr;

    ssl_certificate /etc/letsencrypt/live/lawai-reboot.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lawai-reboot.kro.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 30m;

    # API → api-gateway (트레일링 슬래시로 /api 프리픽스 제거)
    location /api/ {
        proxy_pass http://api-gateway:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 정적 파일
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
