# lawai-reboot.kro.kr — 정적 프론트 서빙 + /api 게이트웨이 프록시 + TLS
server {
    listen 80;
    listen [::]:80;
    server_name lawai-reboot.kro.kr;

    # Let's Encrypt 갱신용 챌린지
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외는 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lawai-reboot.kro.kr;

    ssl_certificate /etc/letsencrypt/live/lawai-reboot.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lawai-reboot.kro.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 30m;

    # SSE(실시간 알림 스트림) → api-gateway
    # /api/ 보다 더 긴 prefix 라 nginx longest-prefix match 로 우선 매칭된다.
    # 버퍼링/캐시를 끄고(즉시 push 전달), 장기 연결을 위해 read_timeout 을 크게 잡는다.
    # 일반 /api/ REST 블록에는 영향 없음(이 블록만 SSE 설정).
    location /api/notifications/stream {
        proxy_pass http://api-gateway:3000/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # API → api-gateway (트레일링 슬래시로 /api 프리픽스 제거)
    location /api/ {
        proxy_pass http://api-gateway:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 정적 파일
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
