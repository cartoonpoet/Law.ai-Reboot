# admin 컨테이너 내부 nginx — :80 만 listen, 외부 노출 X.
# web 컨테이너의 nginx 가 admin.lawai-reboot.kro.kr → http://admin/ 로 proxy_pass 한다.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # SPA 정적 파일 (react-router 라 missing path → index.html fallback).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
