# 개발서버(단일 호스트) 전체 스택. 환경값은 같은 디렉터리의 .env 에서 주입.
#   배포: docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: lawai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - lawai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  user-service:
    image: ghcr.io/cartoonpoet/lawai-user-service:latest
    container_name: lawai-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=users"
      USER_SERVICE_PORT: "4002"
      # 코멘트 멘션 이메일 발송(Resend) — 키 없으면 로그 스텁
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      APP_WEB_URL: ${APP_WEB_URL}
      # Cloudflare R2 파일 업로드(presigned URL) — 키 없으면 503 stub
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # presign→confirm 사이 단기 업로드 토큰 sign용(없으면 JWT_ACCESS_SECRET fallback)
      FILE_UPLOAD_SECRET: ${FILE_UPLOAD_SECRET:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      # AI 분석 트리거가 호출하는 ai-service
      AI_SERVICE_HOST: ai-service
      AI_SERVICE_PORT: "4003"
      # AI 자격증명 암복호화 마스터 키(base64 32바이트) — 없으면 자격증명 저장/복호화가 실패한다.
      AI_CREDENTIAL_MASTER_KEY: ${AI_CREDENTIAL_MASTER_KEY}

  auth-service:
    image: ghcr.io/cartoonpoet/lawai-auth-service:latest
    container_name: lawai-auth-service
    restart: unless-stopped
    depends_on:
      - user-service
    environment:
      AUTH_SERVICE_PORT: "4001"
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: "4002"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900s}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      PASSWORD_RESET_TTL_MIN: ${PASSWORD_RESET_TTL_MIN:-30}
      APP_WEB_URL: ${APP_WEB_URL}

  # AI 프로바이더 호출 전담(무상태) — DB/볼륨 없음, TCP 마이크로서비스로만 노출.
  ai-service:
    image: ghcr.io/cartoonpoet/lawai-ai-service:latest
    container_name: lawai-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: "4003"

  api-gateway:
    image: ghcr.io/cartoonpoet/lawai-api-gateway:latest
    container_name: lawai-api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - user-service
      - ai-service
    environment:
      GATEWAY_PORT: "3000"
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "4001"
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: "4002"
      AI_SERVICE_HOST: ai-service
      AI_SERVICE_PORT: "4003"
      # 어드민 서브도메인도 같은 게이트웨이를 호출 → CORS 허용 origin 에 함께 등록.
      # APP_ADMIN_URL 이 .env 에 없으면 admin.lawai-reboot.kro.kr 기본값.
      CORS_ORIGINS: ${APP_WEB_URL},${APP_ADMIN_URL:-https://admin.lawai-reboot.kro.kr}

  admin:
    image: ghcr.io/cartoonpoet/lawai-admin:latest
    container_name: lawai-admin
    restart: unless-stopped
    depends_on:
      - api-gateway
    # 포트 노출 X — web 컨테이너의 nginx 가 admin.lawai-reboot.kro.kr 트래픽을 내부 네트워크로 프록시.

  web:
    image: ghcr.io/cartoonpoet/lawai-web:latest
    container_name: lawai-web
    restart: unless-stopped
    depends_on:
      - api-gateway
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    # 6시간마다 nginx reload — certbot가 갱신한 인증서를 무중단 반영
    command: sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: lawai-certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # 12시간마다 갱신 시도(만료 임박 시에만 실제 갱신)
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'

volumes:
  lawai_pgdata:
