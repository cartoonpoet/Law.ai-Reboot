services:
  postgres:
    image: postgres:16-alpine
    container_name: lawai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lawai
      POSTGRES_PASSWORD: lawai_local_pw
      POSTGRES_DB: lawai
    ports:
      - "5432:5432"
    volumes:
      - lawai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawai -d lawai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lawai_pgdata:
