services:
  postgres:
    image: postgres:16-alpine
    container_name: lawai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lawai
      POSTGRES_PASSWORD: lawai_local_pw
      POSTGRES_DB: lawai
    ports:
      - "5432:5432"
    volumes:
      - lawai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawai -d lawai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # DB가 준비되면 user-service Prisma 스키마를 한 번에 반영하는 원샷 컨테이너.
  # 로컬 편의용으로 `prisma db push`를 사용한다. 마이그레이션 파일은
  # services/user-service/prisma/migrations 에 있고, 운영은 `prisma migrate deploy` 로
  # 적용한다(docker-entrypoint.sh). db push 는 그 이력을 남기지 않는다.
  db-migrate:
    image: node:20-alpine
    container_name: lawai-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://lawai:lawai_local_pw@postgres:5432/lawai?schema=users"
    volumes:
      - ./services/user-service/prisma:/prisma:ro
    command: >
      sh -c "npx --yes prisma@6 db push --schema=/prisma/schema.prisma --skip-generate"
    restart: "no"

volumes:
  lawai_pgdata:
